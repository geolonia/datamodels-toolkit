name: Test

# Runs the tests on every pull request and on main. The tests read the
# fixtures copy of datamodels.jp in test/fixtures/site/, not the live site.
#
# No `paths` filter on purpose: this check is meant to be required on main, and
# a filtered workflow never reports on PRs it skips, which blocks them forever.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test
