name: Action

# Runs this repository's GitHub Action (action.yml) on the small node in
# test/fixtures/node: check and build, without deploying.
#
# No `paths` filter on purpose: a filtered workflow never reports on PRs it
# skips, which blocks them forever if this check is required.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Action
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check and build the fixture node
        id: node
        uses: ./
        with:
          directory: test/fixtures/node
          deploy: 'false'
          offline: 'true'

      - name: The site is there, also in the site output
        env:
          SITE: ${{ steps.node.outputs.site }}
        run: |
          test "$SITE" = "$RUNNER_TEMP/datamodels-site"
          test -f "$SITE/catalog.json"
          test -f "$SITE/ns/road.html"
          test -f "$SITE/models/road/RoadPatrol/index.html"
          grep -qx '  Content-Type: application/ld+json; charset=utf-8' "$SITE/_headers"

  # On a pull request the Action compares the node with the pull request's base
  # branch (#93). Here the node is a git repository of its own, with a local
  # "origin" whose base branch has a release: the check passes as it is, and
  # fails once the pull request removes the release folder.
  removed-release:
    name: Action, removed release
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: A node whose base branch has a release
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          node=$RUNNER_TEMP/node
          cp -R test/fixtures/node "$node"
          node bin/datamodels.mjs release road "$node" --offline
          git init -q --bare "$RUNNER_TEMP/origin.git"
          cd "$node"
          git init -q -b "$BASE_REF"
          git add -A
          git -c user.name=test -c user.email=test@example.org commit -q -m base
          git remote add origin "$RUNNER_TEMP/origin.git"
          git push -q origin "$BASE_REF"

      - name: The check passes with the release in place
        uses: ./
        with:
          directory: ${{ runner.temp }}/node
          deploy: 'false'
          offline: 'true'

      - name: Remove the release folder
        run: rm -r "$RUNNER_TEMP/node/models/road/releases"

      - name: The check fails without it
        id: removed
        continue-on-error: true
        uses: ./
        with:
          directory: ${{ runner.temp }}/node
          deploy: 'false'
          offline: 'true'

      - name: It failed
        env:
          OUTCOME: ${{ steps.removed.outcome }}
        run: test "$OUTCOME" = failure
