# A data model node on GitHub Pages (#14): check the node, build its files and
# pages, and deploy them. It runs this package from the Action's own checkout,
# so a node upgrades by changing the version it pins.
#
# The calling job needs `pages: write` and `id-token: write` to deploy, and the
# `github-pages` environment; see the README for the whole workflow. With
# `deploy: 'false'` it only checks and builds, and a later step can publish the
# folder in the `site` output elsewhere (#51). Inputs reach the shell only
# through environment variables, never inside a command. On a pull request it
# fetches the base branch to compare the release snapshots with it. The job
# token this Action passes reaches only that fetch and GitHub's Pages actions
# that deploy; the toolkit itself runs without it (#127). Put no secrets in the calling job's `env:`: every step of
# the job, this Action's too, inherits it.
name: Data model node (datamodels.jp)
description: Publish your own NGSI-LD data models as a site. Checks and builds node.yaml and models/, then deploys to GitHub Pages.
author: Geolonia
branding:
  icon: database
  color: blue

inputs:
  directory:
    description: The node, the folder with node.yaml and models/.
    default: '.'
  deploy:
    description: Deploy to GitHub Pages ('true') or only check and build ('false', for pull requests or another host).
    default: 'true'
  offline:
    description: Check without the network ('true'), skipping published files and extended models.
    default: 'false'

outputs:
  site:
    description: The folder with the built site, for a later step that publishes it on another host.
    value: ${{ steps.build.outputs.site }}
  page_url:
    description: The URL of the deployed site.
    value: ${{ steps.deploy.outputs.page_url }}

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        # Not the job token, its default: setup-node uses it only to download
        # Node.js, which works without one (#127).
        token: ''

    - name: Install the toolkit
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN GH_TOKEN
        npm ci --omit=dev --ignore-scripts --no-audit --no-fund

    # On a pull request, the check compares the node with the base branch: a
    # published version is never changed or removed, not even a whole release
    # folder (#93). The checkout keeps no credentials, so this step alone gets
    # the job token, in the environment, never on the command line. It runs only
    # git (#127).
    - name: Fetch the base branch
      if: github.base_ref != ''
      shell: bash
      env:
        NODE_DIR: ${{ inputs.directory }}
        BASE_REF: ${{ github.base_ref }}
        TOKEN: ${{ github.token }}
      run: |
        depth=()
        if [ "$(git -C "$NODE_DIR" rev-parse --is-shallow-repository)" = true ]; then depth=(--depth=1); fi
        auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
        echo "::add-mask::$auth"
        GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
          git -C "$NODE_DIR" fetch --quiet --no-tags "${depth[@]}" origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

    # The other steps run without the job token. They also unset the runner's
    # OIDC request variables, which every run step of a job with
    # `id-token: write` gets, and the usual names of a token that the calling job
    # may have in its env. Only this shell and its processes lose them; the
    # deploy steps still get the OIDC variables (#127).
    - name: Check
      shell: bash
      env:
        TOOLKIT: ${{ github.action_path }}
        NODE_DIR: ${{ inputs.directory }}
        OFFLINE: ${{ inputs.offline }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN GH_TOKEN
        args=(check "$NODE_DIR")
        if [ "$OFFLINE" = true ]; then args+=(--offline); fi
        if [ -n "$BASE_REF" ]; then args+=(--base "origin/$BASE_REF"); fi
        node "$TOOLKIT/bin/datamodels.mjs" "${args[@]}"

    - name: Build
      id: build
      shell: bash
      env:
        TOOLKIT: ${{ github.action_path }}
        NODE_DIR: ${{ inputs.directory }}
      run: |
        unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN GH_TOKEN
        node "$TOOLKIT/bin/datamodels.mjs" build "$NODE_DIR" --out "$RUNNER_TEMP/datamodels-site"
        echo "site=$RUNNER_TEMP/datamodels-site" >> "$GITHUB_OUTPUT"

    - name: Upload the site
      if: inputs.deploy == 'true'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ${{ runner.temp }}/datamodels-site

    # deploy-pages takes the job token (its default) to create the deployment.
    - name: Deploy to GitHub Pages
      id: deploy
      if: inputs.deploy == 'true'
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
