contract_dimensions:
- component: convert
  dimension: numeric-domain
  status: claimed
  conditions: "numbers must be finite, whole numbers whole, municipality codes checked (check digit); invalid values are reported, not guessed"
  property_id: P-ROWS-VALIDATED
  provenance:
    kind: documented
    source: "src/convert.mjs code6 and apply cases number, integer"
- component: convert
  dimension: failure-atomicity
  status: claimed
  conditions: an invalid row is reported and the exit code is 1; with --check nothing is written; a parse error stops before output
  property_id: P-CSV-STRICT
  provenance:
    kind: documented
    source: "bin/datamodels.mjs header: \"the exit code is 1 when a row is invalid\""
- component: convert
  dimension: recursive-cyclic-topology
  status: claimed
  conditions: via chains between mapping files are followed once each; a cycle is reported
  property_id: P-ROWS-VALIDATED
  provenance:
    kind: documented
    source: "src/catalog.mjs loadTarget comment: \"the converter reports a cycle\""
- component: convert
  dimension: callback-execution
  status: not-applicable
  conditions: mapping files are data; transforms are a fixed list in the code
  provenance:
    kind: documented
    source: src/convert.mjs TRANSFORMS
- component: convert
  dimension: serialization-reconstruction
  status: claimed
  conditions: a __proto__ column or attribute stays data in the NGSI-LD helpers
  property_id: P-NGSI-PROTO-AS-DATA
  provenance:
    kind: documented
    source: "src/ngsi.mjs setOwn comment: \"would change the object's prototype and drop the attribute\""
- component: convert
  dimension: reference-lifecycle
  status: not-applicable
  conditions: "one run, no objects outlive it"
  provenance:
    kind: documented
    source: bin/datamodels.mjs header
- component: convert
  dimension: concurrency-reentrancy
  status: not-applicable
  conditions: one process per command
  provenance:
    kind: documented
    source: bin/datamodels.mjs header
- component: convert
  dimension: resource-complexity
  status: disclaimed
  conditions: "no limit on file size, rows or columns; the whole CSV is in memory"
  property_id: D-NO-INPUT-LIMITS
  provenance:
    kind: maintainer
    date: 2026-10
- component: convert
  dimension: x-outbound-requests
  status: disclaimed
  conditions: "--site is read with the global fetch: redirects followed, no address check, no deadline"
  property_id: D-OWN-SITE-READS
  provenance:
    kind: maintainer
    date: 2026-10
- component: convert
  dimension: x-agent-instructions
  status: claimed
  conditions: "text from a CSV never adds lines to the mapping file mapping writes; violated at the bound commit by unused header names, a VALID finding"
  property_id: P-CSV-TEXT-NO-NEW-LINES
  provenance:
    kind: maintainer
    date: 2026-10
- component: node-tools
  dimension: numeric-domain
  status: claimed
  conditions: versions X.Y.Z; URLs in node.yaml http(s) without credentials; other nodes https
  property_id: P-CONTEXT-IMPORTS-LISTED
  provenance:
    kind: documented
    source: src/build/node.mjs settingsProblems
- component: node-tools
