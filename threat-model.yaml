properties_claimed:
- id: P-PUBLIC-READS
  kind: integrity
  components:
  - remote-reads
  - node-tools
  - library
  tier: security-critical
  conditions: "reads of other nodes through getter: https, public host names, public addresses at connection, redirects checked, at most 5, prefix kept"
  violation_symptoms:
  - x-ssrf
  provenance:
    kind: documented
    source: "src/adapters/net.mjs header: \"only https, and only to a public address\""
- id: P-REMOTE-READS-BOUNDED
  kind: resource-bound
  components:
  - remote-reads
  - node-tools
  tier: correctness-only
  conditions: "5 MB per answer; one deadline per read: 15 s in search and nodes, 20 s in check, build, export and extend, 5 s for the guess at a type IRI own index; depth 5, 50 nodes"
  violation_symptoms:
  - hang
  - unbounded-allocation
  provenance:
    kind: documented
    source: src/adapters/net.mjs MAX_BYTES; src/discover.mjs MAX_DEPTH
- id: P-REMOTE-NAMES-CHECKED
  kind: integrity
  components:
  - remote-reads
  tier: security-critical
  conditions: extend and export use a remote type name and version only when UpperCamelCase and x.y.z
  violation_symptoms:
  - x-file-injection
  provenance: *id015
- id: P-TERMINAL-TEXT-PLAIN
  kind: output-sanitization
  components:
  - remote-reads
  tier: security-critical
  conditions: "the search and nodes listing; not --json, not notes of other commands"
  violation_symptoms:
  - x-terminal-injection
  provenance: *id016
- id: P-CONTEXT-IMPORTS-LISTED
  kind: integrity
  components:
  - node-tools
  tier: correctness-only
  conditions: "imports only from the node's own or a listed node's /context/, after URL normalisation"
  violation_symptoms:
  - bad-data-accepted
  provenance:
    kind: documented
    source: "CHANGELOG.md 0.3.15 \"Security\": \"The build checks a `@context` imported by URL after\""
- id: P-BASE-COMPARISON
  kind: integrity
  components:
  - node-tools
  - action
  tier: security-critical
  conditions: "check --base: released snapshot files at the ref unchanged and present; prerelease flag kept; not during the pre-release"
  violation_symptoms:
  - integrity-bypass
  provenance: *id017
- id: P-PUBLISHED-COMPARISON
  kind: integrity
  components:
  - node-tools
  tier: correctness-only
  conditions: online only; exact versions served equal the build; release refuses changed sources
  violation_symptoms:
  - integrity-bypass
  provenance:
    kind: documented
    source: "datamodels.jp/en/toolkit/versions \"How a published version is kept\""
- id: P-CSV-STRICT
  kind: correctness
  components:
  - convert
  tier: correctness-only
  conditions: "strict decoding (UTF-8, Shift_JIS) and RFC 4180 parsing"
  violation_symptoms:
  - bad-data-accepted
  provenance:
    kind: documented
    source: src/convert.mjs decodeCsv and parseCsv comments
- id: P-CSV-TEXT-NO-NEW-LINES
  kind: integrity
  components:
  - convert
  tier: correctness-only
  conditions: "text from a CSV never adds lines to the mapping file mapping writes; violated at the bound commit by unused header names (src/mapping.mjs:444)"
  violation_symptoms:
  - x-file-injection
  provenance:
    kind: maintainer
    date: 2026-10
- id: P-ROWS-VALIDATED
  kind: correctness
  components:
  - convert
  tier: correctness-only
  conditions: every entity validated against the model schema; only valid entities written
