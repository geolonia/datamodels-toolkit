known_misuses:
- id: M-FOREIGN-MAPPING
  components:
  - convert
  pattern: converting with a mapping file from someone else
  safer_alternative: write or review it
  provenance:
    kind: maintainer
    date: 2026-10
- id: M-VALID-AS-SAFE
  components:
  - convert
  pattern: rendering convert output unescaped because every row was valid
  safer_alternative: escape in the app
  provenance:
    kind: documented
    source: "datamodels.jp/en/toolkit/check \"What check checks\""
- id: M-WRITE-PERMS-ON-PR
  components:
  - action
  pattern: one job with write permissions on pull_request and main
  safer_alternative: two jobs as init writes them
  provenance:
    kind: documented
    source: "README \"The whole workflow that init writes\""
- id: M-PRERELEASE-OLDER-VERSIONS
  components:
  - node-tools
  pattern: expecting check --base to fail when an older release changes before the launch
  safer_alternative: "review, or launch"
  provenance:
    kind: documented
    source: "datamodels.jp/en/toolkit/versions \"Before the launch\""
- id: M-INTERNAL-SITE
  components:
  - convert
  - node-tools
  pattern: pointing --site or baseUrl at an internal host
  safer_alternative: use a local directory for --site
  provenance:
    kind: maintainer
    date: 2026-10
- id: M-AGENT-FOLLOWS-TEXT
  components:
  - agent-skill
  pattern: an agent following an instruction in a model description
  safer_alternative: treat it as data
  provenance:
    kind: maintainer
    date: 2026-10
- id: M-UNPINNED-NPX
  components:
  - release-pipeline
  pattern: "npx @geolonia/datamodels without a version in CI"
  safer_alternative: "pin @X.Y.Z"
  provenance:
    kind: documented
    source: "README \"Install\""
known_non_findings:
- id: KNF-PRERELEASE-NOTE
  components:
  - node-tools
  - action
  symptom: integrity-change
  tool_pattern: "\"check --base passes although a released snapshot file changed or was removed\""
  conditions: "node.yaml has prerelease: true at the base ref and in the change; the output lists the file as a note \"corrected in place during the pre-release\""
  discharged_by:
  - D-PRERELEASE-CORRECTIONS
  provenance:
    kind: documented
    source: "datamodels.jp/en/toolkit/versions \"Before the launch\": \"check --base notes the corrections and removals instead of failing\""
- id: KNF-TOKEN-BASE-FETCH
  components:
  - action
  symptom: credential-exposure
  tool_pattern: "\"the Action reads github.token\" or \"passes a token to git\""
  conditions: "the token is used only in the \"Check\" step's git fetch of the base branch, through GIT_CONFIG_* environment variables, masked, with persist-credentials: false on the checkout"
  discharged_by:
  - P-ACTION-TOKEN-USE
  provenance:
    kind: documented
    source: "action.yml comment: \"passed to this one fetch in the environment\""
- id: KNF-OTHER-NODE-DOWN
  components:
  - node-tools
  - remote-reads
  symptom: missing-failure
  tool_pattern: "\"check exits 0 although an extended model or a remote context could not be read\""
  conditions: the output has a note for that URL; the URL belongs to another node
  discharged_by:
  - D-OTHER-NODES-NOTED
  provenance:
    kind: documented
    source: "datamodels.jp/en/toolkit/check: \"does not answer within 20 seconds, is only noted\""
- id: KNF-OIDC-PUBLISH
  components:
  - release-pipeline
  symptom: excessive-permission
  tool_pattern: "\"the publish workflow has id-token: write\""
  conditions: "the job is publish in publish.yml, runs on a published non-pre-release, installs with --ignore-scripts"
  discharged_by:
  - P-RELEASE-GATED
  provenance:
    kind: documented
    source: ".github/workflows/publish.yml comment: \"the OIDC token npm exchanges for a publish token\""
